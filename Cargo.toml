[package]
name = "webp-anim"
version = "0.1.2"
edition = "2024"
rust-version = "1.87"
description = "Sequential, bounded-memory animated WebP processing for Rust"
license = "MIT"
repository = "https://github.com/cbz-tools/webp-anim"
homepage = "https://github.com/cbz-tools/webp-anim"
documentation = "https://docs.rs/webp-anim"
readme = "README.md"
exclude = ["README.ZIP", "*.zip", "*.ZIP"]
keywords = ["webp", "animation", "image-processing", "image-codec"]
categories = ["multimedia::images", "multimedia::encoding"]

[dependencies]
fast_image_resize = "6.1.0"
libwebp-sys = { version = "0.14.4", features = ["neon"] }
